name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: jobflow
          POSTGRES_PASSWORD: jobflow
          POSTGRES_DB: jobflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobflow -d jobflow"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://jobflow:jobflow@localhost:5432/jobflow?sslmode=disable
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.9'
          cache-dependency-path: go.sum
      - name: Verify formatting and generated queries
        run: |
          make fmt generate
          git diff --exit-code
      - run: make build vet test race
      - run: make integration
      - run: go test -race -tags=integration -count=1 ./tests/integration

  sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - run: python -m pip install ./sdk/python
      - run: python -m unittest discover -s sdk/python/tests -v

  dashboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Check dashboard
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run build
          npx playwright install --with-deps chromium --only-shell
          npm test
      - name: Start live Compose stack
        run: |
          docker compose -p jobflow-ci-dashboard up --build -d dashboard worker
          curl -fsS --retry 30 --retry-all-errors --retry-delay 1 \
            http://127.0.0.1:5173/api/v1/workers
      - name: Test against the live API
        working-directory: web
        env:
          JOBFLOW_E2E_URL: http://127.0.0.1:5173
        run: npm test -- tests/live.spec.ts
      - if: failure()
        run: docker compose -p jobflow-ci-dashboard logs --tail=50
      - if: always()
        run: docker compose -p jobflow-ci-dashboard down --volumes

  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RELIABILITY_PROJECT: jobflow-m3-ci
    steps:
      - uses: actions/checkout@v6
      - run: python3 tests/load/benchmark.py --jobs 100 --workers 2 --vus 4
      - run: python3 tests/reliability/compose_recovery.py
      - if: failure()
        run: docker compose -p "$RELIABILITY_PROJECT" logs --tail=50
      - if: always()
        run: docker compose -p "$RELIABILITY_PROJECT" down --volumes
