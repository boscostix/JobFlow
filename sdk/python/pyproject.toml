[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobflow-client"
version = "0.1.0"
description = "Synchronous HTTP client for the JobFlow REST API"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1"]

[tool.setuptools]
packages = ["jobflow"]
